name: Daily Congressional Trade Report

on:
  schedule:
    # GitHub Actions cron schedules always run in UTC and are NOT adjusted
    # for daylight saving time, so a single fixed cron expression can only
    # ever match 8:00 AM US/Eastern for one of the two DST states. Both
    # possible UTC times are scheduled here (13:00 UTC for EST, 12:00 UTC
    # for EDT); the "check-schedule" job below inspects the actual US/Eastern
    # wall-clock hour at runtime and skips whichever trigger doesn't
    # correspond to the current DST state, so the pipeline still only
    # actually runs once per day, at 8:00 AM US/Eastern year-round.
    - cron: "0 13 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Determine if this trigger is the intended 8am US/Eastern run
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current_hour_et="$(TZ="America/New_York" date +%H)"
          if [ "$current_hour_et" = "08" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: this scheduled trigger fired at ${current_hour_et}:00 US/Eastern. GitHub Actions cron is UTC-only and doesn't shift for DST, so both a 12:00 UTC and 13:00 UTC trigger are scheduled; only the one matching 8:00 AM US/Eastern under the current DST offset should actually run."
          fi

  run-pipeline:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore pipeline data cache
        uses: actions/cache@v4
        with:
          path: data
          key: pipeline-data

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Gmail secrets
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -z "$GMAIL_ADDRESS" ] || [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "::error::Gmail secrets are missing or empty."
            echo "Go to Settings → Secrets and variables → Actions → Repository secrets"
            echo "Add exactly: GMAIL_ADDRESS and GMAIL_APP_PASSWORD"
            exit 1
          fi
          echo "Gmail secrets are configured."

      - name: Run pipeline
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python main.py
