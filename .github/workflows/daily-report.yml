name: Daily Congressional Trade Report

on:
  schedule:
    # ~8:00 AM US Eastern (13:17 UTC during EST, 12:17 UTC during EDT).
    # Deliberately NOT on the hour: GitHub Actions' own docs warn that the
    # `schedule` event "can be delayed during periods of high loads... high
    # load times include the start of every hour" and recommend scheduling
    # at a different time of the hour to reduce the chance of delay.
    # Confirmed live: every one of this workflow's 9 scheduled runs from
    # 2026-08-30 through 2026-09-07 (while this cron was "0 13 * * *") fired
    # 2h43m-6h20m after its nominal 13:00 UTC trigger time, so the "daily"
    # report was consistently landing in the afternoon/evening instead of
    # the morning. Offsetting the minute won't guarantee on-time delivery,
    # but avoids the single worst-case scheduling pattern GitHub calls out.
    - cron: "17 13 * * *"
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore pipeline data cache
        uses: actions/cache@v4
        with:
          path: data
          key: pipeline-data

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Gmail secrets
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -z "$GMAIL_ADDRESS" ] || [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "::error::Gmail secrets are missing or empty."
            echo "Go to Settings → Secrets and variables → Actions → Repository secrets"
            echo "Add exactly: GMAIL_ADDRESS and GMAIL_APP_PASSWORD"
            exit 1
          fi
          echo "Gmail secrets are configured."

      - name: Run pipeline
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python main.py
